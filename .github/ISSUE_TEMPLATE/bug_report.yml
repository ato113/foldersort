name: Bug report
description: Something didn't work the way you expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what did you get instead?
      placeholder: I ran `foldersort run` and ...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your config
      description: The relevant part of your foldersort.yaml. Feel free to trim paths.
      render: yaml

  - type: input
    id: version
    attributes:
      label: foldersort version
      description: Output of `foldersort --version`
      placeholder: foldersort 0.2.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true

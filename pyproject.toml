[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tidy-cli"
version = "0.2.0"
description = "Organize a folder with rules you can read."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Arda Ceylan", email = "ceylanarda15@gmail.com" }]
keywords = ["cli", "files", "organizer", "automation", "downloads"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/ato113/tidy"
Issues = "https://github.com/ato113/tidy/issues"
Changelog = "https://github.com/ato113/tidy/blob/main/CHANGELOG.md"

[project.scripts]
tidy = "tidy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tidy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# Local naive datetimes are intentional: file mtimes are naive and local.
ignore = ["E501"]
